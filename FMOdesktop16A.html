<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Office Dashboard - Cyber Modern V16 (Combined Weather & 30s Windy)</title>
    <style>
        :root { 
            --bg: #09090b; 
            --panel: #18181b; 
            --text-main: #f4f4f5; 
            --text-muted: #a1a1aa;
            --cyan: #22d3ee; 
            --emerald: #34d399; 
            --amber: #fbbf24; 
            --rose: #f43f5e; 
            --border: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Segoe UI", Roboto, sans-serif;
            height: 100vh; width: 100vw; display: flex; flex-direction: column; 
            padding: 1.5vh 1.5vw; overflow: hidden;
        }
        
        /* --- 頂部區域 --- */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 1.5vh; border-bottom: 2px solid var(--border); padding-bottom: 1.5vh;
            height: 14vh; flex-shrink: 0;
        }
        
        .clock-group { display: flex; align-items: center; width: 28%; height: 100%; gap: 1vw; }
        
        .time-main { font-size: 11vh; font-weight: 900; color: var(--cyan); display: flex; align-items: baseline; line-height: 1; letter-spacing: -0.1vw;}
        .time-sec { font-size: 4.5vh; color: var(--amber); margin-left: 0.5vw; font-weight: bold; }
        .date-group { display: flex; flex-direction: column; justify-content: center; gap: 0.5vh; border-left: 2px solid var(--border); padding-left: 1vw;}
        .date-line { font-size: 2.2vh; color: var(--text-muted); font-weight: bold; letter-spacing: 0.1vw; white-space: nowrap; }
        
        /* 置中區域 API 自繪 9天天氣預報 */
        .header-mid { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            height: 100%; padding: 0 1vw; overflow: hidden;
        }
        .fnd-container { 
            display: flex; width: 100%; height: 100%; gap: 0.4vw; 
            justify-content: space-between; align-items: center; 
        }
        .fnd-day { 
            flex: 1; background: rgba(255,255,255,0.02); border-radius: 0.5vw; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            border: 1px solid rgba(255,255,255,0.05); height: 100%; gap: 0.5vh;
        }
        .fnd-day-title { font-size: 1.6vh; color: var(--text-muted); font-weight: bold; }
        .fnd-day-icon { font-size: 3vh; }
        .fnd-day-temp { font-size: 1.8vh; color: var(--amber); font-weight: 900; }

        .off-work-group { text-align: right; display: flex; flex-direction: column; justify-content: center; width: 22%; height: 100%; }
        .cd-label { font-size: 2vh; color: var(--text-muted); margin-bottom: 0.2vh; font-weight: bold; }
        .cd-value { font-size: 5vh; font-weight: 900; color: var(--emerald); line-height: 1; letter-spacing: 0.1vw; }

        .refresh-text { position: absolute; bottom: 0.8vh; right: 1vw; font-size: 1.6vh; color: #52525b; font-weight: bold; z-index: 10; }

        /* --- 主要佈局 (兩大區塊：左40% / 右60%) --- */
        .main-container { display: flex; gap: 1vw; flex: 1; min-height: 0; }
        
        /* 左欄佔 40% (比例2) */
        .col-left { flex: 2; display: flex; flex-direction: column; gap: 1vh; min-height: 0; }
        
        /* 右方綜合欄佔 60% (比例3)，內部分上下結構 */
        .col-right-wrapper { flex: 3; display: flex; flex-direction: column; gap: 1vh; min-height: 0; }

        /* 面板共用樣式 */
        .panel { 
            background: var(--panel); border: 1px solid var(--border); border-radius: 0.8vw; 
            padding: 1.2vh 1.2vw; display: flex; flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); min-height: 0; overflow: hidden;
        }
        .panel-title { 
            font-size: 2.2vh; font-weight: bold; color: var(--text-muted); 
            margin-bottom: 1vh; display: flex; align-items: center; letter-spacing: 0.1vw; flex-shrink: 0; transition: all 0.3s ease;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        /* --- 交通物流 --- */
        .transport-list { display: flex; flex-direction: column; gap: 1vh; flex: 1; justify-content: space-evenly; }
        .transport-item { display: flex; flex-direction: column; flex: 1; justify-content: center; }
        .transport-route { font-size: 2.5vh; font-weight: bold; color: #fff; margin-bottom: 0.5vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .eta-grid { display: flex; justify-content: space-between; gap: 0.8vw; flex: 1; }
        .eta-cell { 
            flex: 1; background: #27272a; border-radius: 0.6vw; border: 1px solid #3f3f46;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0.5vh 0;
        }
        
        .hl-time { color: var(--emerald); font-size: 3.5vh; font-weight: 900; line-height: 1.2; }
        .hl-mins { color: var(--amber); font-size: 2vh; font-weight: bold; }
        .hl-empty { color: #52525b; font-size: 3vh; font-weight: bold; }

        /* --- 天氣資料 --- */
        .current-weather {
            background: rgba(34, 211, 238, 0.05); border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 0.6vw; padding: 0.8vh 1vw; margin-bottom: 0.8vh;
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .cw-place { font-size: 1.6vh; color: var(--text-muted); font-weight: bold; display: flex; flex-direction: column; }
        .cw-place-hl { color: var(--text-main); font-size: 2vh; }
        .cw-data-group { display: flex; gap: 1.5vw; align-items: center; }
        .cw-item { font-size: 2.8vh; font-weight: 900; display: flex; align-items: center; gap: 0.5vw; }
        
        .warn-badge {
            background: rgba(244, 63, 94, 0.15); border: 1px solid var(--rose);
            padding: 0.3vh 0.6vw; border-radius: 0.4vw;
            display: flex; align-items: center; gap: 0.3vw;
            font-size: 1.6vh; color: var(--text-main); font-weight: bold; white-space: nowrap;
        }
        
        .weather-container { display: flex; flex-direction: column; flex: 1; justify-content: space-evenly; overflow: hidden; }
        .weather-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 0.3vh; }
        .weather-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        .w-date { font-weight: bold; color: #fff; font-size: 2vh; flex: 0.8; white-space: nowrap; }
        .w-desc { color: var(--cyan); font-size: 2vh; flex: 1.2; text-align: center; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .w-temp { color: var(--amber); font-size: 2vh; flex: 1.2; text-align: center; font-weight: 900; white-space: nowrap; }
        .w-rh { color: var(--text-muted); font-size: 1.8vh; flex: 0.8; text-align: right; white-space: nowrap; }

        /* --- 相機與 CCTV 框架 --- */
        .cam-box { flex: 1; display: flex; flex-direction: column; min-height: 0; height: 100%; }
        .cam-label { 
            font-size: 1.8vh; color: var(--text-muted); margin-bottom: 0.5vh; 
            font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .cam-frame { flex: 1; border-radius: 0.6vw; border: 1px solid var(--border); overflow: hidden; background: #000; position: relative; }
        .cam-img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* --- 網頁嵌入圖表 (Windy) --- */
        .iframe-container { flex: 1; border-radius: 0.6vw; border: 1px solid var(--border); overflow: hidden; position: relative; background: #000; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; display: block; }

        /* 下半部媒體區域的 flex 排版 */
        .bottom-media-row { display: flex; gap: 1vw; flex: 1.4; min-height: 0; }
    </style>
</head>
<body>

    <div class="header">
        <div class="clock-group">
            <div class="time-main">
                <span id="time-hours-mins">00:00</span>
                <span class="time-sec" id="time-secs">00</span>
            </div>
            <div class="date-group">
                <div class="date-line" id="digital-date-1">--月--日</div>
                <div class="date-line" id="digital-date-2">星期--</div>
            </div>
        </div>
        
        <div class="header-mid">
            <div class="fnd-container" id="hko-9day-data">
                <div style="color: var(--text-muted); font-size: 2vh;">正在載入天文台預報數據...</div>
            </div>
        </div>

        <div class="off-work-group">
            <div class="cd-label" id="cd-label">STATUS</div>
            <div class="cd-value" id="off-work-countdown">--:--:--</div>
        </div>
    </div>

    <div class="main-container">
        
        <!-- 左欄 (40%)：交通預報與交通CCTV -->
        <div class="col-left">
            <div class="panel" style="flex: 1.3;">
                <div class="panel-title">🚌 實時交通預報</div>
                <div class="transport-list">
                    <div class="transport-item">
                        <div class="transport-route">城巴 26 號線 (荷里活道公園)</div>
                        <div class="eta-grid">
                            <div class="eta-cell" id="bus-26-eta1"><div class="hl-empty">--:--</div></div>
                            <div class="eta-cell" id="bus-26-eta2"><div class="hl-empty">--:--</div></div>
                            <div class="eta-cell" id="bus-26-eta3"><div class="hl-empty">--:--</div></div>
                        </div>
                    </div>
                    <div class="transport-item">
                        <div class="transport-route">回家 - 城巴</div>
                        <div class="eta-grid">
                            <div class="eta-cell" id="bus-930-eta1"><div class="hl-empty">--:--</div></div>
                            <div class="eta-cell" id="bus-930-eta2"><div class="hl-empty">--:--</div></div>
                            <div class="eta-cell" id="bus-930-eta3"><div class="hl-empty">--:--</div></div>
                        </div>
                    </div>
                    <div class="transport-item" style="flex-direction: row; gap: 1vw;">
                        <div style="flex: 2; display: flex; flex-direction: column;">
                            <div class="transport-route">🚢 渡輪 (中環)</div>
                            <div class="eta-grid">
                                <div class="eta-cell" id="ferry-mw-eta1"><div class="hl-empty">--:--</div></div>
                                <div class="eta-cell" id="ferry-mw-eta2"><div class="hl-empty">--:--</div></div>
                            </div>
                        </div>
                        <div style="flex: 1; display: flex; flex-direction: column;">
                            <div class="transport-route" style="color: var(--rose);">回家 - 九巴</div>
                            <div class="eta-grid">
                                <div class="eta-cell" id="bus-934-eta1"><div class="hl-empty">--:--</div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="panel" style="flex: 0.7; padding-bottom: 1.5vh;">
                <div class="panel-title">📷 交通實時監控</div>
                <div class="cam-box">
                    <div class="cam-label" id="cctv-label" style="color: var(--cyan);">載入中...</div>
                    <div class="cam-frame">
                        <img id="td-cctv" class="cam-img" src="" alt="Traffic CCTV">
                    </div>
                </div>
            </div>
        </div>

        <!-- 右方綜合區塊 (佔 60%) -->
        <div class="col-right-wrapper">
            
            <!-- 上半部：橫跨的實時天氣與未來預報 -->
            <div class="panel" style="flex: 0.6;">
                <div class="panel-title">🌤️ 實時天氣及未來預報</div>
                <div class="current-weather">
                    <div class="cw-place">
                        <span>CURRENT</span>
                        <span class="cw-place-hl">📍 上環</span>
                    </div>
                    <div class="cw-data-group">
                        <div class="cw-item" style="color: var(--amber);" id="cw-temp">--°C</div>
                        <div class="cw-item" style="color: var(--cyan);" id="cw-hum">💧 --%</div>
                        <div id="cw-warn" style="display: flex; gap: 0.5vw;"></div>
                    </div>
                </div>
                <div class="weather-container" id="weather-content">
                    <div style="text-align: center; color: var(--text-muted); font-size: 2vh;">天氣載入中...</div>
                </div>
            </div>

            <!-- 下半部：Windy 與 天氣相片左右並排，高度一致 -->
            <div class="bottom-media-row">
                <!-- 左方：Windy 圖像 (佔此區塊的 2/3) -->
                <div class="panel" style="flex: 2; padding-bottom: 1.5vh;">
                    <div class="panel-title" id="windy-title" style="margin-bottom: 0.5vh; color: var(--cyan);">📡 實時天氣雷達 (Windy)</div>
                    <div class="iframe-container">
                        <iframe id="windy-iframe" src=""></iframe>
                    </div>
                </div>

                <!-- 右方：天氣相片 (佔此區塊的 1/3) -->
                <div class="panel" style="flex: 1; padding-bottom: 1.5vh;">
                    <div class="panel-title">📷 實時影像</div>
                    <div class="cam-box">
                        <div class="cam-label">中環碼頭 (望維港)</div>
                        <div class="cam-frame">
                            <img id="hko-cam" class="cam-img" src="" alt="Live Cam">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="refresh-text" id="refresh-countdown">REFRESH: --s</div>

    <script>
        /* === 系統時間與倒數 === */
        function updateTime() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayStr = days[now.getDay()];
            
            document.getElementById('time-hours-mins').innerText = `${hrs}:${mins}`;
            document.getElementById('time-secs').innerText = secs;
            document.getElementById('digital-date-1').innerText = `${month}月${date}日`;
            document.getElementById('digital-date-2').innerText = `星期${dayStr}`;

            const day = now.getDay();
            if (day >= 1 && day <= 5) {
                const currentHour = now.getHours();
                if (currentHour < 13) {
                    const lunchTime = new Date(now);
                    lunchTime.setHours(13, 0, 0, 0); 
                    renderCountdown(lunchTime - now, "🍔 距離午膳 (LUNCH)");
                } else {
                    const offTime = new Date(now);
                    offTime.setHours(17, 18, 0, 0); 
                    renderCountdown(offTime - now, "🏃‍♂️ 距離下班 (OFF-WORK)");
                }
            } else {
                document.getElementById('cd-label').innerText = "☕ 週末休息";
                document.getElementById('off-work-countdown').innerText = "HOLIDAY";
                document.getElementById('off-work-countdown').style.color = "var(--text-muted)";
            }
        }

        function renderCountdown(diff, label) {
            document.getElementById('cd-label').innerText = label;
            if (diff > 0) {
                const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
                const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
                const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
                document.getElementById('off-work-countdown').innerText = `${h}:${m}:${s}`;
                document.getElementById('off-work-countdown').style.color = "var(--emerald)";
            } else {
                document.getElementById('off-work-countdown').innerText = "00:00:00";
                document.getElementById('off-work-countdown').style.color = "var(--cyan)";
            }
        }

        /* === 交通 ETA 工具 === */
        function formatClockTime(isoString) {
            if (!isoString) return "--:--";
            const d = new Date(isoString);
            return String(d.getHours()).padStart(2, '0') + ":" + String(d.getMinutes()).padStart(2, '0');
        }

        function getMinutesDiff(etaTimeString) {
            if (!etaTimeString) return null;
            const now = new Date();
            const etaTime = new Date(etaTimeString);
            const diffMs = etaTime - now;
            return Math.ceil(diffMs / 1000 / 60);
        }

        function generateEtaBox(timeStr, minsLeft) {
            let status = ""; let colorStyle = "";
            if (minsLeft <= 0) { status = "即將到站"; colorStyle = "color: var(--rose);"; } 
            else { status = `${minsLeft} 分鐘`; }
            return `<div class="hl-time">${timeStr}</div><div class="hl-mins" style="${colorStyle}">${status}</div>`;
        }
        function generateEmptyBox() { return `<div class="hl-empty">--:--</div>`; }

        /* 城巴與九巴 API */
        async function fetchCitybusETA(url, elementPrefix) {
            try {
                const response = await fetch(url);
                const result = await response.json();
                let validData = [];
                if (result && result.data && result.data.length > 0) {
                    validData = result.data.filter(d => d.eta).sort((a, b) => a.eta_seq - b.eta_seq);
                }
                for (let i = 1; i <= 3; i++) {
                    let el = document.getElementById(`${elementPrefix}-eta${i}`);
                    if (!el) continue;
                    if (validData[i-1]) {
                        el.innerHTML = generateEtaBox(formatClockTime(validData[i-1].eta), getMinutesDiff(validData[i-1].eta));
                    } else {
                        el.innerHTML = generateEmptyBox();
                    }
                }
            } catch (error) {
                for(let i=1; i<=3; i++) {
                    let el = document.getElementById(`${elementPrefix}-eta${i}`);
                    if (el) el.innerHTML = `<div class="hl-empty" style="color:var(--rose);">錯誤</div>`;
                }
            }
        }

        async function fetchKmbEta(route, elementId) {
            try {
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}/1`);
                const result = await response.json();
                let el = document.getElementById(elementId);
                if (!el) return;
                if (result && result.data && result.data.length > 0) {
                    let validData = result.data.filter(d => d.eta && d.dir === 'I' && parseInt(d.seq, 10) === 6 && getMinutesDiff(d.eta) >= 0);
                    validData.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                    if (validData.length > 0) {
                        el.innerHTML = generateEtaBox(formatClockTime(validData[0].eta), getMinutesDiff(validData[0].eta));
                    } else { el.innerHTML = generateEmptyBox(); }
                } else { el.innerHTML = generateEmptyBox(); }
            } catch (error) {
                let el = document.getElementById(elementId);
                if (el) el.innerHTML = `<div class="hl-empty" style="color:var(--rose);">錯誤</div>`;
            }
        }

        /* 渡輪預測 */
        const ferrySchedule = ['07:00', '07:30', '07:50', '08:30', '08:50', '09:30', '10:00', '10:30', '12:30', '14:30', '16:30', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00', '20:30', '21:30'];
        function calculateLocalFerryETA() {
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            let upcoming = [];
            for (let time of ferrySchedule) {
                let [h, m] = time.split(':').map(Number);
                let scheduleMins = h * 60 + m;
                if (scheduleMins >= currentMins) upcoming.push({ timeStr: time, diff: scheduleMins - currentMins });
                if (upcoming.length === 2) break;
            }
            let i = 0;
            while (upcoming.length < 2 && i < ferrySchedule.length) {
                let [h, m] = ferrySchedule[i].split(':').map(Number);
                upcoming.push({ timeStr: ferrySchedule[i], diff: (h + 24) * 60 + m - currentMins });
                i++;
            }
            for (let j = 1; j <= 2; j++) {
                let el = document.getElementById(`ferry-mw-eta${j}`);
                if (!el) continue;
                if (upcoming[j-1]) el.innerHTML = generateEtaBox(upcoming[j-1].timeStr, upcoming[j-1].diff);
                else el.innerHTML = generateEmptyBox();
            }
        }

        /* === 天氣 API (包含智能圖示配對) === */
        function getWarnIcon(code, name) {
            let emoji = "⚠️";
            if(code.includes("WRAIN")) emoji = "🌧️";
            else if(code.includes("WTS")) emoji = "⚡";
            else if(code.includes("TC")) emoji = "🌀";
            else if(code.includes("WHOT")) emoji = "🥵";
            else if(code.includes("WCOLD")) emoji = "🥶";
            
            let shortName = name.replace("警告信號", "").replace("警告", "").replace("信號", "");
            if(shortName === "黃色暴雨") shortName = "黃雨";
            if(shortName === "紅色暴雨") shortName = "紅雨";
            if(shortName === "黑色暴雨") shortName = "黑雨";
            
            return `<div class="warn-badge"><span>${emoji}</span><span>${shortName}</span></div>`;
        }

        async function fetchWeather() {
            try {
                const currentRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const currentData = await currentRes.json();
                let temp = "--";
                if(currentData.temperature && currentData.temperature.data) {
                    const hkp = currentData.temperature.data.find(d => d.place === "香港公園");
                    temp = hkp ? hkp.value : currentData.temperature.data[0].value; 
                }
                let hum = (currentData.humidity && currentData.humidity.data.length > 0) ? currentData.humidity.data[0].value : "--";
                
                document.getElementById('cw-temp').innerText = `${temp}°C`;
                document.getElementById('cw-hum').innerText = `💧 ${hum}%`;
            } catch (e) {}

            try {
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                let warnHtml = '';
                if (warnData && Object.keys(warnData).length > 0) {
                    for (const key in warnData) warnHtml += getWarnIcon(warnData[key].code, warnData[key].name);
                } else {
                    warnHtml = `<span style="font-size: 1.6vh; color: var(--text-muted); font-weight: normal;">(無天氣警報)</span>`;
                }
                document.getElementById('cw-warn').innerHTML = warnHtml;
            } catch (e) {}

            try {
                const forecastRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const forecastData = await forecastRes.json();
                
                if (forecastData && forecastData.weatherForecast) {
                    // 1. 中欄：未來 3 天預報
                    const next3Days = forecastData.weatherForecast.slice(0, 3);
                    let htmlContent = '';
                    next3Days.forEach(day => {
                        const mm = day.forecastDate.substring(4, 6).replace(/^0+/, '');
                        const dd = day.forecastDate.substring(6, 8);
                        const weekShort = day.week.replace('星期', ''); 
                        let shortDesc = day.forecastWeather.split(/。|，/)[0];
                        htmlContent += `
                            <div class="weather-row">
                                <div class="w-date">${mm}/${dd} (${weekShort})</div>
                                <div class="w-desc">${shortDesc}</div>
                                <div class="w-temp">${day.forecastMintemp.value}° - ${day.forecastMaxtemp.value}°C</div>
                                <div class="w-rh">💧 ${day.forecastMinrh.value}% - ${day.forecastMaxrh.value}%</div>
                            </div>
                        `;
                    });
                    document.getElementById('weather-content').innerHTML = htmlContent;

                    // 2. 頂部：9 天預報圖表
                    let fndHtml = '';
                    forecastData.weatherForecast.forEach(day => {
                        const dd = day.forecastDate.substring(6, 8);
                        const weekShort = day.week.replace('星期', '');
                        const weatherDesc = day.forecastWeather;
                        
                        let icon = '☁️'; 
                        if (weatherDesc.includes('雷')) {
                            icon = '⛈️'; // 雷暴 / 狂風雷暴
                        } else if (weatherDesc.includes('驟雨')) {
                            icon = '🌦️'; // 驟雨
                        } else if (weatherDesc.includes('雨')) {
                            icon = '🌧️'; // 微雨 / 大雨 / 暴雨
                        } else if (weatherDesc.includes('部分時間有陽光') || weatherDesc.includes('短暫時間有陽光') || weatherDesc.includes('明朗')) {
                            icon = '⛅'; // 間中有陽光
                        } else if (weatherDesc.includes('天晴') || (weatherDesc.includes('晴') && !weatherDesc.includes('雲'))) {
                            icon = '☀️'; // 晴朗無雲
                        } else if (weatherDesc.includes('多雲') || weatherDesc.includes('陰')) {
                            icon = '☁️'; // 密雲 / 陰天
                        } else if (weatherDesc.includes('晴')) {
                            icon = '🌤️'; // 晴天帶少量雲
                        }
                        
                        fndHtml += `
                            <div class="fnd-day">
                                <div class="fnd-day-title">${dd}日(${weekShort})</div>
                                <div class="fnd-day-icon" title="${weatherDesc}">${icon}</div>
                                <div class="fnd-day-temp">${day.forecastMintemp.value}-${day.forecastMaxtemp.value}°</div>
                            </div>
                        `;
                    });
                    document.getElementById('hko-9day-data').innerHTML = fndHtml;
                }
            } catch (e) {
                document.getElementById('hko-9day-data').innerHTML = `<div style="color: var(--rose);">預報數據連線失敗</div>`;
            }
        }

        /* === 相片與 CCTV 更新系統 === */
        function updateImages() {
            document.getElementById('hko-cam').src = `https://www.hko.gov.hk/wxinfo/aws/hko_mica/cp1/latest_CP1.jpg?t=${new Date().getTime()}`;
        }

        const cctvList = [
            { id: 'K911F', name: '西九龍公路油麻地北交匯處' },
            { id: 'H702F', name: '西區海底隧道香港入口' },
            { id: 'TC560F', name: '青馬大橋' }
        ];
        let cctvIndex = 0;

        function rotateCCTV() {
            const cam = cctvList[cctvIndex];
            const labelEl = document.getElementById('cctv-label');
            const imgEl = document.getElementById('td-cctv');
            if(labelEl && imgEl) {
                labelEl.innerText = `${cam.name}`;
                imgEl.src = `https://tdcctv.data.one.gov.hk/${cam.id}.JPG?t=${new Date().getTime()}`;
            }
            cctvIndex = (cctvIndex + 1) % cctvList.length;
        }

        /* === Windy 二合一輪播系統 (減速為 30 秒) === */
        const windyMaps = [
            { 
                title: "📡 實時天氣雷達 (Windy)", 
                url: "https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km/h&zoom=9&overlay=radar&product=radar&level=surface&lat=22.350&lon=114.170" 
            },
            { 
                title: "🌬️ 實時風向流動 (Windy)", 
                url: "https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km/h&zoom=8&overlay=wind&product=ecmwf&level=surface&lat=22.350&lon=114.170" 
            }
        ];
        let windyIndex = 0;

        function rotateWindy() {
            const map = windyMaps[windyIndex];
            document.getElementById('windy-title').innerText = map.title;
            document.getElementById('windy-iframe').src = map.url;
            windyIndex = (windyIndex + 1) % windyMaps.length;
        }

        /* === 初始化與排程 === */
        function updateAllData() {
            fetchCitybusETA('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002741/26', 'bus-26');
            fetchCitybusETA('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/001193/930', 'bus-930');
            fetchKmbEta('934', 'bus-934-eta1'); 
            calculateLocalFerryETA();
            fetchWeather();
            updateImages(); 
        }

        // 時鐘與計時器 (每秒執行)
        updateTime();
        setInterval(updateTime, 1000); 

        // CCTV 輪播 (每 5 秒切換一次)
        rotateCCTV();
        setInterval(rotateCCTV, 5000);

        // Windy 輪播 (已更新：每 30 秒切換一次)
        rotateWindy();
        setInterval(rotateWindy, 30000);

        // 主數據刷新 (每 30 秒)
        updateAllData();
        let countdown = 30;
        setInterval(() => {
            countdown--;
            if (countdown < 0) {
                countdown = 30;
                updateAllData(); 
            }
            document.getElementById('refresh-countdown').innerText = `REFRESH: ${countdown}s`;
        }, 1000);
    </script>
</body>
</html>
