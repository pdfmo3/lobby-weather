<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>香港天氣資訊顯示屏</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #1e1b4b 100%);
            color: var(--text-main);
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* 防止出現卷軸 */
            display: flex;
            flex-direction: column;
        }

        /* 使用 vw 單位，確保隨螢幕自動放大 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2vw 3vw;
            background: rgba(0, 0, 0, 0.2);
        }

        .title { font-size: 2.5vw; font-weight: bold; color: #38bdf8; }
        .time { font-size: 5vw; font-weight: bold; }
        .date { font-size: 1.8vw; color: #94a3b8; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2vw;
        }

        .warning-title { font-size: 2vw; margin-bottom: 2vw; color: #94a3b8; }

        #warning-container {
            display: flex;
            gap: 2vw;
            justify-content: center;
            width: 100%;
        }

        .warning-card {
            background: rgba(30, 41, 59, 0.7);
            display: flex;
            align-items: center;
            gap: 1.5vw;
            padding: 2vw 3vw;
            border-radius: 2vw;
            border: 0.2vw solid rgba(255, 255, 255, 0.1);
        }

        .warning-icon-wrapper { width: 6vw; height: 6vw; }
        .warning-icon-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        .warning-card .name { font-size: 2.5vw; font-weight: bold; }

        .forecast-section {
            background: rgba(0, 0, 0, 0.4);
            padding: 2vw 3vw;
            height: 35vh; /* 佔據底部約 1/3 高度 */
        }

        #forecast-container {
            display: flex;
            justify-content: space-between;
            height: 100%;
            gap: 1vw;
        }

        .forecast-card {
            background: rgba(30, 41, 59, 0.7);
            flex: 1;
            padding: 1vw;
            border-radius: 1vw;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .f-date { font-size: 1.5vw; font-weight: bold; }
        .f-icon { width: 4vw; height: 4vw; margin: 0.5vw auto; }
        .f-temp { font-size: 1.6vw; font-weight: bold; }
        .f-rh { font-size: 1.2vw; color: #94a3b8; }
    </style>
</head>
<body>
    <header>
        <div class="title">香港即時天氣資訊</div>
        <div class="datetime">
            <div class="time" id="clock-time">00:00:00</div>
            <div class="date" id="clock-date">載入中...</div>
        </div>
    </header>

    <div class="main-content">
        <div class="warning-title">現時生效天氣警告</div>
        <div id="warning-container"><div class="no-warning">載入資料中...</div></div>
    </div>

    <div class="forecast-section">
        <div id="forecast-container"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
            document.getElementById('clock-date').innerText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
        }
        setInterval(updateClock, 1000); updateClock();

        const iconMap = { "VHOT": "vhot", "WCCOLD": "cold", "WTS": "ts", "WRAINY": "rainy", "WRAINR": "rainr", "WRAINB": "rainb", "TC1": "tc1", "TC3": "tc3", "TC8NE": "tc8ne", "TC8SE": "tc8se", "TC8NW": "tc8nw", "TC8SW": "tc8sw", "TC9": "tc9", "TC10": "tc10", "WMSGNL": "sms", "WLANDSLIP": "landslip", "WFIREY": "firey", "WFIRER": "firer", "FROST": "frost", "WFNW": "ntwc" };

        window.handleImgError = function(img) {
            img.style.display = 'none';
        };

        async function fetchWarnings() {
            const res = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc");
            const data = await res.json();
            const container = document.getElementById('warning-container');
            container.innerHTML = Object.keys(data).length === 0 ? '<div class="no-warning" style="font-size:2vw;">✅ 現時並無生效的天氣警告</div>' : "";
            for (const key in data) {
                const fileName = iconMap[data[key].code] || "ts";
                container.innerHTML += `<div class="warning-card"><div class="warning-icon-wrapper"><img src="https://www.hko.gov.hk/img/warn/${fileName}.png" onerror="handleImgError(this)"></div><div class="name">${data[key].name}</div></div>`;
            }
        }

        async function fetchForecast() {
            const res = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc");
            const data = await res.json();
            const container = document.getElementById('forecast-container');
            container.innerHTML = "";
            data.weatherForecast.forEach(day => {
                container.innerHTML += `<div class="forecast-card"><div class="f-date">${day.forecastDate.substring(6,8)}/${day.forecastDate.substring(4,6)}</div><img class="f-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${day.ForecastIcon}.png"><div class="f-temp">${day.forecastMintemp.value}°-${day.forecastMaxtemp.value}°</div><div class="f-rh">${day.forecastMinrh.value}%-${day.forecastMaxrh.value}%</div></div>`;
            });
        }

        fetchWarnings(); fetchForecast();
        setInterval(fetchWarnings, 300000); setInterval(fetchForecast, 1800000);
    </script>
</body>
</html>
