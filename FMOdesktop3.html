<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Office Dashboard - Pro Tablet V3</title>
    <style>
        :root { 
            --bg: #0f172a; 
            --panel: #1e293b; 
            --text: #f8fafc; 
            --accent: #38bdf8; 
            --danger: #ef4444;
            --warning: #fbbf24;
            --success: #10b981;
            --highlight-bg: rgba(16, 185, 129, 0.15);
            --date-color: #a78bfa; /* 日期的專屬粉紫色 */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 強制無滾動條，完美適配橫向平板 */
        body { 
            background: var(--bg); color: var(--text); font-family: "PingFang HK", 'Segoe UI', sans-serif;
            height: 100vh; width: 100vw; display: flex; flex-direction: column; padding: 1.5vh 2vw; overflow: hidden;
        }
        
        /* 表頭區域 - 加入日期樣式 */
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5vh; padding-bottom: 1vh; border-bottom: 2px solid #334155; }
        .clock { font-size: 10vh; font-weight: bold; line-height: 0.85; color: var(--accent); letter-spacing: 0.2vw; display: flex; align-items: baseline; }
        .clock-sec { font-size: 0.55em; color: var(--warning); letter-spacing: 0.1vw; }
        .clock-date { font-size: 0.35em; color: var(--date-color); font-weight: normal; margin-left: 1.5vw; letter-spacing: 0.1vw; }
        
        .countdown { font-size: 3vh; color: #94a3b8; text-align: right; font-weight: normal; }

        /* 主要佈局 */
        .main-container { display: flex; gap: 2vw; flex: 1; min-height: 0; }
        .left-column { flex: 1.4; display: flex; flex-direction: column; gap: 1.5vh; height: 100%; }
        .right-column { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; height: 100%; }

        /* 面板基礎樣式 */
        .panel { background: var(--panel); border-radius: 1vw; padding: 1.5vh 1.5vw; box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2); display: flex; flex-direction: column; }
        .panel-title { font-size: 2.8vh; font-weight: normal; margin-bottom: 1vh; color: var(--accent); display: flex; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 0.8vh; }
        
        /* --- 左欄：交通物流 --- */
        .transport-list { display: flex; flex-direction: column; gap: 1.2vh; flex: 1; justify-content: space-between; }
        .transport-item { background: #111827; padding: 1.2vh 1.5vw; border-radius: 1vw; border: 1px solid #334155; }
        .transport-route { font-size: 3vh; font-weight: normal; color: #fff; margin-bottom: 1vh; display: block; }
        
        .eta-grid { display: flex; justify-content: space-between; gap: 1vw; }
        .eta-cell { 
            flex: 1; background: #1e293b; border-radius: 0.8vw; padding: 1vh 0.5vw; 
            text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 1px solid #334155;
        }
        
        .highlight-time { 
            color: var(--success); background: var(--highlight-bg); 
            padding: 0.2vh 1vw; border-radius: 0.5vw; font-weight: bold; 
            font-size: 3.5vh; border: 1px solid var(--success); margin-bottom: 0.5vh; display: inline-block;
        }
        .eta-mins { color: var(--warning); font-size: 3.2vh; font-weight: bold; }

        /* --- 右欄：收工倒數面板 --- */
        .off-work-panel {
            flex: 0 0 auto; 
            padding: 1.5vh 1.5vw; 
            background: rgba(30, 41, 59, 0.8); 
            border: 1px solid var(--warning); 
            border-radius: 1vw;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.1);
        }
        .off-work-text {
            font-size: 3vh; 
            color: var(--warning); 
            font-weight: bold; 
            text-align: center; 
            letter-spacing: 0.1vw;
        }

        /* --- 右欄：天氣 (壓縮空白) --- */
        .weather-container { display: flex; flex-direction: column; flex: 1; justify-content: center; gap: 0.5vh; }
        .weather-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0.6vh 0; /* 壓縮原有的上下留白 */
            border-bottom: 1px dashed #334155; 
        }
        .weather-row:last-child { border-bottom: none; }
        
        .w-date { font-weight: normal; color: #fff; font-size: 2.6vh; flex: 1; }
        .w-desc { font-weight: normal; color: var(--accent); font-size: 2.5vh; flex: 1.2; text-align: center; }
        .w-temp { color: var(--warning); font-weight: bold; font-size: 2.8vh; flex: 1.2; text-align: center; }
        .w-rh { color: #94a3b8; font-weight: normal; font-size: 2.2vh; flex: 1; text-align: right; }

        /* --- 右欄：行車時間 --- */
        .traffic-table { width: 100%; border-collapse: collapse; margin-top: 0.5vh; }
        .traffic-table th, .traffic-table td { padding: 1.2vh; text-align: center; border: 1px solid #334155; }
        .traffic-table th { background: #111827; color: var(--accent); font-size: 2.5vh; font-weight: normal; }
        .traffic-td-label { text-align: left; color: #fff; padding-left: 2vw; line-height: 1.4; font-size: 2.8vh; font-weight: normal; }
        
        .time-badge { padding: 0.8vh; border-radius: 0.5vw; font-weight: bold; display: block; width: 100%; font-size: 3.5vh; }
        .badge-blue { background: rgba(56, 189, 248, 0.2); color: var(--accent); border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <div class="clock" id="digital-clock">
            <!-- 時間與日期注入點 -->
            00:00<span class="clock-sec">:00</span>
            <span class="clock-date" id="digital-date"></span>
        </div>
        <div class="countdown" id="refresh-countdown">數據更新倒數: -- 秒</div>
    </div>

    <div class="main-container">
        
        <!-- 左欄：實時交通到站預報 -->
        <div class="left-column">
            <div class="panel" style="flex: 1;">
                <div class="panel-title">🚌 實時交通到站預報</div>
                <div class="transport-list">
                    
                    <div class="transport-item">
                        <span class="transport-route">城巴 26 號線 (荷里活道公園)</span>
                        <div class="eta-grid">
                            <div class="eta-cell" id="bus-26-eta1">載入中...</div>
                            <div class="eta-cell" id="bus-26-eta2">載入中...</div>
                            <div class="eta-cell" id="bus-26-eta3">載入中...</div>
                        </div>
                    </div>
                    
                    <div class="transport-item">
                        <span class="transport-route">回家巴士</span>
                        <div class="eta-grid">
                            <div class="eta-cell" id="bus-930-eta1">載入中...</div>
                            <div class="eta-cell" id="bus-930-eta2">載入中...</div>
                            <div class="eta-cell" id="bus-930-eta3">載入中...</div>
                        </div>
                    </div>

                    <div class="transport-item">
                        <span class="transport-route">🚢 渡輪服務 (中環開出)</span>
                        <div class="eta-grid">
                            <div class="eta-cell" id="ferry-mw-eta1">載入中...</div>
                            <div class="eta-cell" id="ferry-mw-eta2">載入中...</div>
                            <div class="eta-cell" id="ferry-mw-eta3">載入中...</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- 右欄：收工倒數、天氣 及 行車時間 -->
        <div class="right-column">
            
            <!-- 新增：右上角收工時間倒數面板 -->
            <div class="off-work-panel">
                <div id="off-work-countdown" class="off-work-text">
                    🏃‍♂️ 下班倒數計算中...
                </div>
            </div>

            <!-- 天氣面板 (空白已壓縮) -->
            <div class="panel" style="flex: 1;">
                <div class="panel-title">🌤️ 天文台 未來 3 天預報</div>
                <div class="weather-container" id="weather-content">
                    <div style="text-align: center; color: #94a3b8; font-size: 2.5vh;">天氣資訊載入中...</div>
                </div>
            </div>

            <!-- 行車時間面板 -->
            <div class="panel">
                <div class="panel-title">🚗 主要幹道行車時間</div>
                <table class="traffic-table">
                    <thead>
                        <tr>
                            <th style="text-align: left; padding-left: 2vw;">出發路段</th>
                            <th style="width: 35%;">西區海底隧道</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="traffic-td-label">
                                堅拿道天橋北行<br>
                                <span style="font-size: 2vh; color: #94a3b8;">(近香港仔隧道出口)</span>
                            </td>
                            <td><span class="time-badge badge-blue">8 分鐘</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            
            // 處理日期與星期 (要求1)
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayStr = days[now.getDay()];
            
            // 渲染時鐘與旁邊的日期
            document.getElementById('digital-clock').innerHTML = 
                `${hrs}:${mins}<span class="clock-sec">:${secs}</span>` + 
                `<span class="clock-date">${month}月${date}日 (星期${dayStr})</span>`;

            // 處理下班倒數邏輯 (要求2)
            const day = now.getDay();
            if(day >= 1 && day <= 5) { // 星期一至五
                const offTime = new Date(now);
                offTime.setHours(17, 18, 0, 0); // 目標時間 17:18
                const diff = offTime - now;

                if(diff > 0) {
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    let cdText = "🏃‍♂️ 距離下班還有: ";
                    if (h > 0) cdText += `${h} 小時 `;
                    cdText += `${m} 分 ${s} 秒`;
                    document.getElementById('off-work-countdown').innerText = cdText;
                } else {
                    document.getElementById('off-work-countdown').innerText = "🎉 已經下班啦！快啲走！";
                }
            } else {
                // 週末
                document.getElementById('off-work-countdown').innerText = "☕ 今日週末休息";
            }
        }

        function formatClockTime(isoString) {
            if (!isoString) return "--:--";
            const d = new Date(isoString);
            return String(d.getHours()).padStart(2, '0') + ":" + String(d.getMinutes()).padStart(2, '0');
        }

        function getMinutesDiff(etaTimeString) {
            if (!etaTimeString) return null;
            const now = new Date();
            const etaTime = new Date(etaTimeString);
            const diffMs = etaTime - now;
            const diffMins = Math.ceil(diffMs / 1000 / 60);
            return diffMins > 0 ? diffMins : 0;
        }

        function generateEtaBox(timeStr, minsLeft) {
            let status = minsLeft === 0 ? "即將抵達" : `${minsLeft} 分鐘`;
            return `<span class="highlight-time">${timeStr}</span><span class="eta-mins">${status}</span>`;
        }

        function generateEmptyBox() {
            return `<span class="highlight-time" style="color:#64748b; background:transparent; border-color:#334155;">--:--</span><span class="eta-mins" style="color:#64748b;">--</span>`;
        }

        async function fetchBusETA(url, elementPrefix) {
            try {
                const response = await fetch(url, { cache: 'no-store' });
                const result = await response.json();
                
                let validData = [];
                if (result && result.data && result.data.length > 0) {
                    validData = result.data.filter(d => d.eta).sort((a, b) => a.eta_seq - b.eta_seq);
                }
                
                for(let i = 1; i <= 3; i++) {
                    let el = document.getElementById(`${elementPrefix}-eta${i}`);
                    if (validData[i-1]) {
                        const m = getMinutesDiff(validData[i-1].eta);
                        const t = formatClockTime(validData[i-1].eta);
                        el.innerHTML = generateEtaBox(t, m);
                    } else {
                        el.innerHTML = generateEmptyBox();
                    }
                }
            } catch (error) {
                for(let i=1; i<=3; i++) {
                    document.getElementById(`${elementPrefix}-eta${i}`).innerHTML = `<span style="color:#ef4444; font-size:2.5vh;">連線錯誤</span>`;
                }
            }
        }

        async function fetchWeather() {
            try {
                const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc', { cache: 'no-store' });
                const result = await response.json();
                
                if (result && result.weatherForecast) {
                    const next3Days = result.weatherForecast.slice(0, 3);
                    let htmlContent = '';
                    
                    next3Days.forEach(day => {
                        const mm = day.forecastDate.substring(4, 6).replace(/^0+/, '');
                        const dd = day.forecastDate.substring(6, 8);
                        const weekShort = day.week.replace('星期', ''); 
                        
                        let shortDesc = day.forecastWeather.split(/。|，/)[0];
                        if(shortDesc.length > 5) shortDesc = shortDesc.substring(0, 5) + "..."; 

                        htmlContent += `
                            <div class="weather-row">
                                <div class="w-date">${mm}/${dd} (${weekShort})</div>
                                <div class="w-desc">${shortDesc}</div>
                                <div class="w-temp">${day.forecastMintemp.value}° - ${day.forecastMaxtemp.value}°C</div>
                                <div class="w-rh">💧 ${day.forecastMinrh.value}%-${day.forecastMaxrh.value}%</div>
                            </div>
                        `;
                    });
                    
                    document.getElementById('weather-content').innerHTML = htmlContent;
                }
            } catch (error) {
                document.getElementById('weather-content').innerHTML = `<div style="text-align: center; color: #ef4444; font-size: 2.5vh;">天氣 API 連線失敗</div>`;
            }
        }

        const ferrySchedule = [
            '06:30','07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00',
            '11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00',
            '16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00',
            '21:30','22:00','22:30','23:00','23:30'
        ];

        function calculateLocalFerryETA() {
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            let upcoming = [];
            
            for (let time of ferrySchedule) {
                let [h, m] = time.split(':').map(Number);
                let scheduleMins = h * 60 + m;
                if (scheduleMins >= currentMins) {
                    upcoming.push({ timeStr: time, diff: scheduleMins - currentMins });
                }
                if (upcoming.length === 3) break;
            }
            
            let i = 0;
            while (upcoming.length < 3) {
                let [h, m] = ferrySchedule[i].split(':').map(Number);
                let scheduleMins = (h + 24) * 60 + m; 
                upcoming.push({ timeStr: ferrySchedule[i], diff: scheduleMins - currentMins });
                i++;
            }

            for(let j = 1; j <= 3; j++) {
                let el = document.getElementById(`ferry-mw-eta${j}`);
                let f = upcoming[j-1];
                el.innerHTML = generateEtaBox(f.timeStr, f.diff);
            }
        }

        function updateAllData() {
            fetchBusETA('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002741/26', 'bus-26');
            fetchBusETA('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/001193/930', 'bus-930');
            calculateLocalFerryETA();
            fetchWeather();
        }

        // 初始化
        updateTime();
        updateAllData();
        setInterval(updateTime, 1000); 

        let countdown = 30;
        setInterval(() => {
            countdown--;
            if (countdown < 0) {
                countdown = 30;
                updateAllData(); 
            }
            document.getElementById('refresh-countdown').innerText = `數據更新倒數: ${countdown} 秒`;
        }, 1000);
    </script>
</body>
</html>
