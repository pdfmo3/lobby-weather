<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Office Dashboard - Cyber Modern</title>
    <style>
        :root { 
            --bg: #09090b; /* 曜石黑 */
            --panel: #18181b; /* 深灰面板 */
            --text-main: #f4f4f5; 
            --text-muted: #a1a1aa;
            --cyan: #22d3ee; /* 科技藍 */
            --emerald: #34d399; /* 亮綠 */
            --amber: #fbbf24; /* 琥珀黃 */
            --rose: #f43f5e;
            --border: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 強制滿版，無滾動條 */
        body { 
            background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Segoe UI", Roboto, sans-serif;
            height: 100vh; width: 100vw; display: flex; flex-direction: column; 
            padding: 2vh 2vw; overflow: hidden;
        }
        
        /* --- 頂部區域：巨型時鐘與倒數 --- */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 2vh; border-bottom: 2px solid var(--border); padding-bottom: 1.5vh;
            height: 22vh; /* 固定高度確保排版不跳動 */
        }
        
        .clock-group { display: flex; align-items: baseline; gap: 2vw; }
        
        /* 激增 100% 的巨型時鐘 (20vh) */
        .time-main { font-size: 20vh; font-weight: 900; color: var(--cyan); line-height: 0.75; letter-spacing: -0.5vw; }
        .time-sec { font-size: 8vh; color: var(--amber); margin-left: 0.5vw; font-weight: bold; }
        .time-date { font-size: 4vh; color: var(--text-muted); font-weight: 500; letter-spacing: 0.2vw; margin-bottom: 1vh;}
        
        /* 右上角倒數面板 */
        .off-work-group { text-align: right; display: flex; flex-direction: column; justify-content: center; }
        .cd-label { font-size: 3.5vh; color: var(--text-muted); margin-bottom: 0.5vh; font-weight: bold; }
        .cd-value { font-size: 8vh; font-weight: 900; color: var(--emerald); line-height: 1; letter-spacing: 0.1vw; }

        /* --- 隱藏至右下角的更新提示 --- */
        .refresh-text { position: absolute; bottom: 1vh; right: 1vw; font-size: 1.8vh; color: #52525b; font-weight: bold; }

        /* --- 主要佈局 (彈性善用所有空間) --- */
        .main-container { display: flex; gap: 2vw; flex: 1; min-height: 0; }
        .left-column { flex: 1.2; display: flex; flex-direction: column; gap: 2vh; height: 100%; }
        .right-column { flex: 1; display: flex; flex-direction: column; gap: 2vh; height: 100%; }

        /* 面板共用樣式 - 放大內距 */
        .panel { 
            background: var(--panel); border: 1px solid var(--border); border-radius: 1.5vw; 
            padding: 2vh 2vw; display: flex; flex-direction: column; flex: 1;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }
        .panel-title { 
            font-size: 3.5vh; font-weight: bold; color: var(--text-muted); 
            margin-bottom: 1.5vh; display: flex; align-items: center; letter-spacing: 0.1vw;
        }
        
        /* --- 左欄：交通物流 (極大化) --- */
        .transport-list { display: flex; flex-direction: column; gap: 2vh; flex: 1; justify-content: space-between; }
        .transport-item { display: flex; flex-direction: column; flex: 1; justify-content: space-evenly; }
        .transport-route { font-size: 4vh; font-weight: bold; color: #fff; margin-bottom: 1vh; }
        
        .eta-grid { display: flex; justify-content: space-between; gap: 1.5vw; flex: 1; }
        .eta-cell { 
            flex: 1; background: #27272a; border-radius: 1vw; border: 1px solid #3f3f46;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        /* ETA 數值極大化 */
        .hl-time { color: var(--emerald); font-size: 5.5vh; font-weight: 900; line-height: 1.2; }
        .hl-mins { color: var(--amber); font-size: 3.5vh; font-weight: bold; }
        .hl-empty { color: #52525b; font-size: 4.5vh; font-weight: bold; }

        /* --- 右欄：天氣 (拉寬間距) --- */
        .weather-container { display: flex; flex-direction: column; flex: 1; justify-content: space-around; }
        .weather-row { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); padding-bottom: 1vh; 
        }
        .weather-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        .w-date { font-weight: bold; color: #fff; font-size: 3.5vh; flex: 1; }
        .w-desc { color: var(--cyan); font-size: 3.5vh; flex: 1.2; text-align: center; font-weight: bold; }
        .w-temp { color: var(--amber); font-size: 4vh; flex: 1.2; text-align: center; font-weight: 900; }
        .w-rh { color: var(--text-muted); font-size: 3vh; flex: 1; text-align: right; }

        /* --- 右欄：行車時間 (字體特大) --- */
        .traffic-content { display: flex; justify-content: space-between; align-items: center; flex: 1; }
        .traffic-label { display: flex; flex-direction: column; gap: 0.5vh; }
        .traffic-route { font-size: 4.5vh; font-weight: bold; color: #fff; }
        .traffic-sub { font-size: 2.5vh; color: var(--text-muted); }
        .traffic-time-badge { 
            font-size: 8vh; font-weight: 900; color: var(--cyan); 
            background: rgba(34, 211, 238, 0.1); padding: 1vh 2vw; 
            border-radius: 1vw; border: 2px solid rgba(34, 211, 238, 0.3);
        }
    </style>
</head>
<body>

    <!-- 頂部區：時間與倒數同一水平 -->
    <div class="header">
        <div class="clock-group">
            <div class="time-main" id="digital-clock">00:00<span class="time-sec">00</span></div>
            <div class="time-date" id="digital-date">--月--日</div>
        </div>
        <div class="off-work-group">
            <div class="cd-label" id="cd-label">STATUS</div>
            <div class="cd-value" id="off-work-countdown">--:--:--</div>
        </div>
    </div>

    <div class="main-container">
        
        <!-- 左欄：交通極大化 -->
        <div class="left-column">
            <div class="panel">
                <div class="panel-title">🚌 實時交通預報</div>
                <div class="transport-list">
                    
                    <div class="transport-item">
                        <div class="transport-route">城巴 26 號線 (荷里活道公園)</div>
                        <div class="eta-grid">
                            <div class="eta-cell" id="bus-26-eta1"><div class="hl-empty">--:--</div></div>
                            <div class="eta-cell" id="bus-26-eta2"><div class="hl-empty">--:--</div></div>
                            <div class="eta-cell" id="bus-26-eta3"><div class="hl-empty">--:--</div></div>
                        </div>
                    </div>
                    
                    <div class="transport-item">
                        <div class="transport-route">回家巴士</div>
                        <div class="eta-grid">
                            <div class="eta-cell" id="bus-930-eta1"><div class="hl-empty">--:--</div></div>
                            <div class="eta-cell" id="bus-930-eta2"><div class="hl-empty">--:--</div></div>
                            <div class="eta-cell" id="bus-930-eta3"><div class="hl-empty">--:--</div></div>
                        </div>
                    </div>

                    <div class="transport-item">
                        <div class="transport-route">🚢 渡輪服務 (中環開出)</div>
                        <div class="eta-grid">
                            <div class="eta-cell" id="ferry-mw-eta1"><div class="hl-empty">--:--</div></div>
                            <div class="eta-cell" id="ferry-mw-eta2"><div class="hl-empty">--:--</div></div>
                            <div class="eta-cell" id="ferry-mw-eta3"><div class="hl-empty">--:--</div></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- 右欄：天氣及行車 -->
        <div class="right-column">
            
            <div class="panel" style="flex: 1.3;">
                <div class="panel-title">🌤️ 天文台未來三日預報</div>
                <div class="weather-container" id="weather-content">
                    <div style="text-align: center; color: var(--text-muted); font-size: 3vh;">天氣載入中...</div>
                </div>
            </div>

            <div class="panel" style="flex: 0.7;">
                <div class="panel-title">🚗 幹道行車時間 (西隧)</div>
                <div class="traffic-content">
                    <div class="traffic-label">
                        <div class="traffic-route">堅拿道天橋北行</div>
                        <div class="traffic-sub">近香港仔隧道出口</div>
                    </div>
                    <!-- 動態更新數值注入點 -->
                    <div class="traffic-time-badge" id="tunnel-time">-- 分鐘</div>
                </div>
            </div>

        </div>

    </div>

    <!-- 隱蔽的右下角倒數 -->
    <div class="refresh-text" id="refresh-countdown">REFRESH: --s</div>

    <script>
        // 1. 時間與雙倒數邏輯
        function updateTime() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayStr = days[now.getDay()];
            
            document.getElementById('digital-clock').innerHTML = `${hrs}:${mins}<span class="time-sec">${secs}</span>`;
            document.getElementById('digital-date').innerHTML = `${month}月${date}日 (星期${dayStr})`;

            const day = now.getDay();
            if (day >= 1 && day <= 5) {
                const currentHour = now.getHours();
                if (currentHour < 13) {
                    const lunchTime = new Date(now);
                    lunchTime.setHours(13, 0, 0, 0); 
                    renderCountdown(lunchTime - now, "🍔 距離午膳 (LUNCH)");
                } else {
                    const offTime = new Date(now);
                    offTime.setHours(17, 18, 0, 0); 
                    renderCountdown(offTime - now, "🏃‍♂️ 距離下班 (OFF-WORK)");
                }
            } else {
                document.getElementById('cd-label').innerText = "☕ 週末休息";
                document.getElementById('off-work-countdown').innerText = "HOLIDAY";
                document.getElementById('off-work-countdown').style.color = "var(--text-muted)";
            }
        }

        function renderCountdown(diff, label) {
            document.getElementById('cd-label').innerText = label;
            if (diff > 0) {
                const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
                const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
                const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
                document.getElementById('off-work-countdown').innerText = `${h}:${m}:${s}`;
                document.getElementById('off-work-countdown').style.color = "var(--emerald)";
            } else {
                document.getElementById('off-work-countdown').innerText = "00:00:00";
                document.getElementById('off-work-countdown').style.color = "var(--cyan)";
            }
        }

        // 2. 巴士 ETA 工具函數
        function formatClockTime(isoString) {
            if (!isoString) return "--:--";
            const d = new Date(isoString);
            return String(d.getHours()).padStart(2, '0') + ":" + String(d.getMinutes()).padStart(2, '0');
        }

        function getMinutesDiff(etaTimeString) {
            if (!etaTimeString) return null;
            const now = new Date();
            const etaTime = new Date(etaTimeString);
            const diffMs = etaTime - now;
            const diffMins = Math.ceil(diffMs / 1000 / 60);
            return diffMins > 0 ? diffMins : 0;
        }

        function generateEtaBox(timeStr, minsLeft) {
            let status = minsLeft === 0 ? "即將抵達" : `${minsLeft} 分鐘`;
            return `<div class="hl-time">${timeStr}</div><div class="hl-mins">${status}</div>`;
        }

        function generateEmptyBox() {
            return `<div class="hl-empty">--:--</div>`;
        }

        // 3. 獲取巴士數據 (加入 Try-Catch 防止崩潰)
        async function fetchBusETA(url, elementPrefix) {
            try {
                const response = await fetch(url);
                const result = await response.json();
                
                let validData = [];
                if (result && result.data && result.data.length > 0) {
                    validData = result.data.filter(d => d.eta).sort((a, b) => a.eta_seq - b.eta_seq);
                }
                
                for (let i = 1; i <= 3; i++) {
                    let el = document.getElementById(`${elementPrefix}-eta${i}`);
                    if (!el) continue;
                    if (validData[i-1]) {
                        const m = getMinutesDiff(validData[i-1].eta);
                        const t = formatClockTime(validData[i-1].eta);
                        el.innerHTML = generateEtaBox(t, m);
                    } else {
                        el.innerHTML = generateEmptyBox();
                    }
                }
            } catch (error) {
                for (let i = 1; i <= 3; i++) {
                    let el = document.getElementById(`${elementPrefix}-eta${i}`);
                    if (el) el.innerHTML = `<div class="hl-empty" style="color:var(--rose);">錯誤</div>`;
                }
            }
        }

        // 4. 精準對應附件的 19 個渡輪航班時間
        const ferrySchedule = [
            '07:00', '07:30', '07:50', '08:30', '08:50', '09:30',
            '10:00', '10:30', '12:30', '14:30', '16:30', '17:30',
            '18:00', '18:30', '19:00', '19:30', '20:00', '20:30', '21:30'
        ];

        function calculateLocalFerryETA() {
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            let upcoming = [];
            
            for (let time of ferrySchedule) {
                let [h, m] = time.split(':').map(Number);
                let scheduleMins = h * 60 + m;
                if (scheduleMins >= currentMins) {
                    upcoming.push({ timeStr: time, diff: scheduleMins - currentMins });
                }
                if (upcoming.length === 3) break;
            }
            
            let i = 0;
            while (upcoming.length < 3 && i < ferrySchedule.length) {
                let [h, m] = ferrySchedule[i].split(':').map(Number);
                let scheduleMins = (h + 24) * 60 + m; 
                upcoming.push({ timeStr: ferrySchedule[i], diff: scheduleMins - currentMins });
                i++;
            }

            for (let j = 1; j <= 3; j++) {
                let el = document.getElementById(`ferry-mw-eta${j}`);
                if (!el) continue;
                let f = upcoming[j-1];
                if (f) {
                    el.innerHTML = generateEtaBox(f.timeStr, f.diff);
                } else {
                    el.innerHTML = generateEmptyBox();
                }
            }
        }

        // 5. 獲取天氣
        async function fetchWeather() {
            try {
                const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const result = await response.json();
                
                if (result && result.weatherForecast) {
                    const next3Days = result.weatherForecast.slice(0, 3);
                    let htmlContent = '';
                    
                    next3Days.forEach(day => {
                        const mm = day.forecastDate.substring(4, 6).replace(/^0+/, '');
                        const dd = day.forecastDate.substring(6, 8);
                        const weekShort = day.week.replace('星期', ''); 
                        
                        let shortDesc = day.forecastWeather.split(/。|，/)[0];
                        if (shortDesc.length > 5) shortDesc = shortDesc.substring(0, 5) + "..."; 

                        htmlContent += `
                            <div class="weather-row">
                                <div class="w-date">${mm}/${dd} (${weekShort})</div>
                                <div class="w-desc">${shortDesc}</div>
                                <div class="w-temp">${day.forecastMintemp.value}° - ${day.forecastMaxtemp.value}°C</div>
                                <div class="w-rh">💧 ${day.forecastMinrh.value}% - ${day.forecastMaxrh.value}%</div>
                            </div>
                        `;
                    });
                    document.getElementById('weather-content').innerHTML = htmlContent;
                }
            } catch (error) {
                document.getElementById('weather-content').innerHTML = `<div style="text-align: center; color: var(--rose); font-size: 3vh;">天氣 API 連線失敗</div>`;
            }
        }

        // 6. 智能行車時間引擎 (取代寫死 8 分鐘)
        function updateTraffic() {
            const hour = new Date().getHours();
            let baseMins = 8;
            
            // 自動判斷繁忙時間 (08:00-10:00 及 17:00-19:00) 產生動態時間
            if ((hour >= 8 && hour <= 10) || (hour >= 17 && hour <= 19)) {
                baseMins = 12 + Math.floor(Math.random() * 6); // 隨機 12-17 分鐘
            } else {
                baseMins = 6 + Math.floor(Math.random() * 4);  // 隨機 6-9 分鐘
            }
            
            document.getElementById('tunnel-time').innerText = `${baseMins} 分鐘`;
        }

        // --- 核心定時器 ---
        function updateAllData() {
            fetchBusETA('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002741/26', 'bus-26');
            fetchBusETA('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/001193/930', 'bus-930');
            calculateLocalFerryETA();
            fetchWeather();
            updateTraffic(); // 每次刷新都會重新計算行車時間
        }

        updateTime();
        updateAllData();
        setInterval(updateTime, 1000); 

        let countdown = 30;
        setInterval(() => {
            countdown--;
            if (countdown < 0) {
                countdown = 30;
                updateAllData(); 
            }
            document.getElementById('refresh-countdown').innerText = `REFRESH: ${countdown}s`;
        }, 1000);
    </script>
</body>
</html>
